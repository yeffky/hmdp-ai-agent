server:
  port: 8081
spring:
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://your-mysql-host:3306/hmdp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: your-database-password
    hikari:
      maximum-pool-size: 4            # 远程共享 MySQL，连接数受限
      minimum-idle: 1
      idle-timeout: 300000            # 5分钟空闲后回收
      max-lifetime: 600000            # 10分钟最大生命周期（需 < MySQL wait_timeout）
      connection-timeout: 10000       # 获取连接超时 10s
      validation-timeout: 5000        # 连接验证超时 5s
      connection-test-query: SELECT 1
  redis:
    host: your-redis-host
    port: 6379
    password: your-redis-password
    timeout: 8s
    client-type: jedis
    jedis:
      pool:
        max-active: 10
        max-idle: 0                   # 不复用空闲连接——避免远程断连后超时
        min-idle: 0
        time-between-eviction-runs: 10s
  rabbitmq:
    host: your-rabbitmq-host
    port: 5672
    username: guest
    password: guest
    # 发布确认：Broker 收到消息后异步回调 ack/nack，配合 ConfirmCallback 感知消息是否真正到达
    publisher-confirm-type: correlated
    # 消息不可路由（mandatory=true）时触发 ReturnsCallback 回调
    publisher-returns: true
    template:
      mandatory: true                  # 配合 publisher-returns：消息无法路由到队列时退回并回调
    listener:
      simple:
        acknowledge-mode: manual      # 手动确认
        prefetch: 1                   # 每次只取1条，公平分发
        concurrency: 3                # 消费者线程数
  jackson:
    default-property-inclusion: non_null
mybatis-plus:
  type-aliases-package: com.hmdp.entity
logging:
  level:
    com.hmdp: debug
  pattern:
    level: "%5p [%X{traceId}]"   # 日志带 traceId，便于按请求串联

deepseek:
  api-key: your-deepseek-api-key
  # 直连 DeepSeek（LangChain4j 1.16.2 原生发 role=tool，无需代理）
  base-url: https://api.deepseek.com
  # 可选：流式模型独立地址（默认回退 base-url）
  # streaming-base-url: https://api.deepseek.com
  model: deepseek-chat
  temperature: 0.7
  max-tokens: 2000
  timeout-seconds: 60

# ========== RAG 配置 ==========
rag:
  qdrant:
    host: http://localhost
    port: 6333
    collection: hmdp_knowledge
    vector-size: 1024
    distance: Cosine

  embedding:
    # 方案一：本地 Ollama
    base-url: http://localhost:11434/v1
    api-key: ollama
    model: bge-m3
    # 方案二：硅基流动 SiliconCloud
    # base-url: https://api.siliconflow.cn/v1
    # api-key: your-siliconflow-api-key
    # model: BAAI/bge-large-zh-v1.5

  retrieval:
    top-k: 5
    score-threshold: 0.3

  splitter:
    chunk-size: 500
    chunk-overlap: 50

  # 文档自动摄入（markitdown CLI）
  document:
    enabled: true
    watch-dir: ./rag-documents
    state-file: ./rag-doc-state.json
    debounce-seconds: 5
    full-scan-interval-seconds: 300
    watch-file-extensions: pdf,docx,doc,pptx,ppt,xlsx,xls,html,htm,csv,json,xml,epub,md,txt
    # 依赖本地 markitdown：pip install "markitdown[all]"
    # Windows 下 `python` 在 JVM 进程环境可能解析到 Store stub（报 exit=9009），建议写完整 python 路径
    markitdown-command: C:/Users/<your-user>/miniconda3/python.exe -m markitdown
    timeout-seconds: 300

# ========== Agent 配置 ==========
agent:
  graph:
    max-iterations: 8
    max-retries: 3
    llm-error-classify: true          # LLM 辅助错误分类（模糊错误语义判断）
  # PostgreSQL（Checkpoint + 用户画像共用）
  postgres:
    url: jdbc:postgresql://your-postgres-host:5432/hmdp
    username: postgres
    password: your-postgres-password
  memory:
    compression:
      enabled: true
      compress-threshold: 4000        # 总 token 超过此值触发压缩
      keep-recent-tokens: 2000        # 保留最近 N tokens 不压缩
      max-summary-tokens: 500         # 压缩摘要最大 token 数
      max-uncompressed-messages: 50   # 硬上限：最多保留消息数（兜底）

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true

# ========== xxl-job 分布式任务调度（执行器） ==========
xxl:
  job:
    enabled: false               # true 时启用执行器（需部署到可被调度中心回调的服务器）
    admin:
      addresses: http://your-xxl-admin-host:8080/xxl-job-admin
    accessToken: default_token
    executor:
      appname: hmdp-executor
      address:                  # 空则自动注册
      ip:                       # 空则自动探测
      port: 9999                # 执行器 HTTP 端口
      logpath: ./logs/xxl-job/jobhandler
      logretentiondays: 30

# ========== JWT 登录令牌（secret 需 >= 32 字符；access 短效 / refresh 长效） ==========
hmdp:
  jwt:
    secret: your-jwt-secret-at-least-32-chars
    access-ttl-minutes: 30      # accessToken 有效期，过期用 refreshToken 续约
    refresh-ttl-days: 7         # refreshToken 最大有效期
  id-obfuscator:
    salt: your-random-id-salt-at-least-32-chars   # Sqids 混淆盐：泄露会导致外部可反推 DB ID，务必替换为随机值且不入库/不提交
