
user administrator;
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/json;

    sendfile        on;
    
    keepalive_timeout  65;

    server {
        listen       8080;
        server_name  localhost;
        # Vue3 SPA 前端（构建产物在 html/hmdp-app，由 frontend/vite.config.js 输出）
        # 启动前先执行：cd frontend && npm install && npm run build
        location / {
            root   html/hmdp-app;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;   # history 路由回退
        }

        # 静态图片：分类图标 / 上传图片（仍保留在旧 hmdp/imgs 目录）
        location /imgs/ {
            root html/hmdp;
            try_files $uri =404;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }


        location /api {
            default_type  application/json;
            keepalive_timeout   30s;
            keepalive_requests  1000;
            proxy_http_version 1.1;
            rewrite /api(/.*) $1 break;
            proxy_pass_request_headers on;
            proxy_next_upstream error timeout;
            proxy_pass http://backend;
        }

        location /chat/ {
            default_type  application/json;
            keepalive_timeout   30s;
            keepalive_requests  1000;
            proxy_http_version 1.1;
            proxy_pass_request_headers on;
            proxy_next_upstream error timeout;
            proxy_buffering off;          # SSE 必须关闭缓冲
            proxy_cache off;              # 禁用缓存
            proxy_read_timeout 120s;      # 长连接超时
            proxy_pass http://backend;
        }

        location /kb/ {
            default_type  application/json;
            keepalive_timeout   30s;
            keepalive_requests  1000;
            proxy_http_version 1.1;
            proxy_pass_request_headers on;
            proxy_next_upstream error timeout;
            proxy_pass http://backend;
        }

        location /queue-ticket/ {
            default_type  application/json;
            keepalive_timeout   30s;
            keepalive_requests  1000;
            proxy_http_version 1.1;
            proxy_pass_request_headers on;
            proxy_next_upstream error timeout;
            proxy_pass http://backend;
        }
    }

    upstream backend {
        server 127.0.0.1:8081 max_fails=3 fail_timeout=10s weight=1;
        server 127.0.0.1:8082 max_fails=3 fail_timeout=10s weight=1;
    }  
}
